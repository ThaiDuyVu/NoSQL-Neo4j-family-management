# Neo4j cho project family-management
# Browser: http://localhost:7474   |   Bolt: bolt://localhost:7687
# User/password lấy từ file .env (mặc định neo4j / family12345)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: family-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-family12345}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
